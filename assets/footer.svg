<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 120" width="900" height="120" role="img" aria-label="less noise. more signal." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .a { fill:#57606a; font:italic 400 40px Georgia,'Times New Roman',serif; }
    .b { fill:#0e7490; font:italic 400 40px Georgia,'Times New Roman',serif; }
    .ln { stroke:#8c959f; stroke-width:1; opacity:.35 }
    .dot { fill:#0e7490 }
    @media (prefers-color-scheme: dark) {
      .a { fill:#8b949e } .b { fill:#67e8f9 } .ln { stroke:#8b949e } .dot { fill:#67e8f9 }
    }
  </style>
  <line class="ln" x1="0" y1="14" x2="430" y2="14"/>
  <circle class="dot" cx="450" cy="14" r="3"/>
  <line class="ln" x1="470" y1="14" x2="900" y2="14"/>
  <text class="a" x="438" y="82" text-anchor="end">less noise.</text>
  <text class="b" x="462" y="82" text-anchor="start">more signal.</text>
</svg>
