<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="900" height="230" role="img" aria-label="Education timeline from 2021 to final year" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .prog { stroke:#0e7490; stroke-width:3; stroke-linecap:round }
    .done { fill:#0e7490; stroke:#0e7490; stroke-width:2.5 }
    .tick { fill:#0e7490; fill-opacity:.55 }
    .yr { fill:#0e7490; font:700 14px 'JetBrains Mono','SF Mono',Menlo,Consolas,monospace; letter-spacing:1px }
    .sp { fill:#57606a; font:400 12px 'JetBrains Mono','SF Mono',Menlo,Consolas,monospace; letter-spacing:1px }
    .tt { fill:#0d1117; font:400 18px Georgia,'Times New Roman',serif }
    .ds { fill:#57606a; font:400 12.5px 'Segoe UI',Helvetica,Arial,sans-serif }
    .pulse { fill:#0e7490 }
    @media (prefers-color-scheme: dark) {
      .prog { stroke:#67e8f9 } .done { fill:#67e8f9; stroke:#67e8f9 } .tick { fill:#67e8f9 }
      .yr { fill:#67e8f9 } .sp { fill:#8b949e } .tt { fill:#e6edf3 } .ds { fill:#8b949e } .pulse { fill:#67e8f9 }
    }
  </style>
  <line class="prog" x1="90" y1="118" x2="786" y2="118"/>
  <text class="yr" x="90" y="92" text-anchor="middle">2021</text>
  <circle class="done" cx="90" cy="118" r="7"/>
  <text class="yr" x="450" y="92" text-anchor="middle">2024</text>
  <circle class="done" cx="450" cy="118" r="7"/>
  <text class="sp" x="270" y="92" text-anchor="middle">2021 – 2024</text>
  <circle class="tick" cx="270" cy="118" r="4"/>
  <text class="sp" x="630" y="92" text-anchor="middle">2024 – present</text>
  <circle class="tick" cx="630" cy="118" r="4"/>
  <text class="yr" x="786" y="92" text-anchor="middle">2026</text>
  <text class="tt" x="90" y="164" text-anchor="middle">10th</text>
  <text class="ds" x="90" y="186" text-anchor="middle">Govt. Model High School</text>
  <text class="ds" x="90" y="204" text-anchor="middle">Sector 20-D, Chandigarh</text>
  <text class="tt" x="270" y="164" text-anchor="middle">Diploma</text>
  <text class="ds" x="270" y="186" text-anchor="middle">CCET Diploma Wing</text>
  <text class="ds" x="270" y="204" text-anchor="middle">Sector 26, Chandigarh</text>
  <text class="tt" x="450" y="164" text-anchor="middle">Lateral entry</text>
  <text class="ds" x="450" y="186" text-anchor="middle">Diploma → B.Tech</text>
  <text class="tt" x="630" y="164" text-anchor="middle">B.Tech CSE</text>
  <text class="ds" x="630" y="186" text-anchor="middle">CGC Landran</text>
  <text class="tt" x="786" y="164" text-anchor="middle">Final year</text>
  <text class="ds" x="786" y="186" text-anchor="middle">DFU detection project</text>
  <circle class="pulse" cx="786" cy="118" r="6">
    <animate attributeName="r" values="6;15;6" dur="2.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".55;0;.55" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <circle class="pulse" cx="786" cy="118" r="6"/>
</svg>
